<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Web Remote Controller with Screen Share</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #111; font-family: Arial, sans-serif; color: #fff; }
        #login-box { text-align: center; margin-top: 100px; }
        #ip-box { text-align: center; margin-top: 200px; }
        input, button { padding: 12px; font-size: 16px; margin: 5px; border-radius: 4px; border: none; }
        input { background: #333; color: #fff; }
        button { background: #007bff; color: white; cursor: pointer; }
        #control-area { position: relative; width: 100%; height: 100%; display: none; }
        #instructions { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.7); padding: 10px 20px; border-radius: 20px; pointer-events: none; z-index: 10; transition: opacity 0.3s ease; }
        #canvas { width: 100%; height: 100%; display: block; cursor: pointer; }
    </style>
</head>
<body>

    <div id="ip-box">
        <h2>Enter Remote IP Address</h2>
        <h3 id="abc"></h3>
        <input type="text" id="ip" placeholder="IP">
        <button onclick="setIp()">Set IP</button>
    </div>
    
    <div id="login-box">
        <h2>Enter Remote Password</h2>
        <input type="password" id="password" placeholder="Password">
        <button onclick="connectToServer()">Connect</button>
    </div>
    
    <div id="control-area">
        <div id="instructions">Click anywhere to capture inputs. Press 'Esc' to exit.</div>
        <canvas id="canvas"></canvas>
    </div>

    <script>
        let ws;
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const instructions = document.getElementById('instructions');
        const img = new Image();

        // When a new frame image loads, paint it onto the browser canvas canvas
        img.onload = function() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        };

        function setIp() {
            let IP = document.getElementById('ip').value
            document.getElementById('abc').textContent = "Connecting to: "+"ws://"+IP+":5555"
        }
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function connectToServer() {
            const password = document.getElementById('password').value;
            ws = new WebSocket("ws://"+IP+":5555");

            ws.onopen = () => {
                ws.send(JSON.stringify({ type: "auth", password: password }));
            };

            ws.onmessage = (event) => {
                const response = JSON.parse(event.data);
                
                if (response.status === "authenticated") {
                    document.getElementById('login-box').style.display = 'none';
                    document.getElementById('control-area').style.display = 'block';
                    resizeCanvas();
                    window.addEventListener('resize', resizeCanvas);
                    setupInputCapturing();
                } else if (response.type === "screen_frame") {
                    // Update image source pointer with the incoming Base64 image payload
                    img.src = "data:image/jpeg;base64," + response.image;
                }
            };
        }

        function setupInputCapturing() {
            canvas.addEventListener('click', () => {
                if (document.fullscreenElement === null) {
                    document.documentElement.requestFullscreen().catch(() => {});
                }
                canvas.requestPointerLock();
            });

            document.addEventListener('pointerlockchange', () => {
                instructions.style.opacity = (document.pointerLockElement === canvas) ? "0" : "1";
            });

            document.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement === canvas) {
                    ws.send(JSON.stringify({ type: "mouse_move", dx: e.movementX, dy: e.movementY }));
                }
            });

            document.addEventListener('keydown', (e) => {
                if (document.pointerLockElement === canvas) {
                    ws.send(JSON.stringify({ type: "key_press", key: e.key }));
                }
            });
        }
    </script>
</body>
</html>
